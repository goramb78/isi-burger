# .github/workflows/laravel.yml
# GitHub Actions CI/CD — ISI BURGER

name: 🍔 ISI BURGER — CI/CD Pipeline

on:
  push:
    branches: [ "gora_thiam_burger", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ═══════════════════════════════════════════════════════════════
  #  JOB 1 — Tests & Qualité
  # ═══════════════════════════════════════════════════════════════
  tests:
    name: 🧪 Tests PHP & Laravel
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: isi_burger_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: rootsecret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql, gd, zip
          coverage: none

      - name: 📦 Cache Composer
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 📦 Installation des dépendances Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: ⚙️ Préparer l'environnement .env
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_HOST=mysql/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=isi_burger/DB_DATABASE=isi_burger_test/' .env
          sed -i 's/DB_USERNAME=laravel/DB_USERNAME=laravel/' .env
          sed -i 's/DB_PASSWORD=secret/DB_PASSWORD=secret/' .env

      - name: 🗄️ Migrations
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: 🔑 Générer la clé d'app
        run: php artisan key:generate --force

      - name: 🧪 Exécuter les tests PHPUnit
        run: ./vendor/bin/phpunit --testdox

  # ═══════════════════════════════════════════════════════════════
  #  JOB 2 — Build Image Docker
  # ═══════════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Build Image Docker
    runs-on: ubuntu-latest
    needs: tests   # N'exécute que si les tests passent

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Connexion Docker Hub (optionnel)
        # Décommentez si vous voulez pusher sur Docker Hub
        # uses: docker/login-action@v3
        # with:
        #   username: ${{ secrets.DOCKER_USERNAME }}
        #   password: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "Skipping Docker Hub login for local build"

      - name: 🏗️ Build de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Partie_1_Setup/Dockerfile
          push: false   # Mettre true pour pusher sur Docker Hub
          tags: |
            isi-burger-app:latest
            isi-burger-app:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: ✅ Résumé du build
        run: |
          echo "### 🐳 Image Docker construite avec succès" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag** : isi-burger-app:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branche** : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════
  #  JOB 3 — Rapport de succès
  # ═══════════════════════════════════════════════════════════════
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [tests, docker-build]
    if: always()

    steps:
      - name: 📊 Résumé du pipeline
        run: |
          echo "### 🍔 ISI BURGER — Pipeline terminé" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Étape | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests PHP | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branche** : \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit** : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Auteur** : ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
